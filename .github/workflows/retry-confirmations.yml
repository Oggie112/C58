name: Retry Confirmation Emails

# Re-sends order confirmation emails that failed (Brevo quota, outage, network)
# — roadmap 8API.4. Calls the site's secret-protected endpoint, which retries
# paid orders still missing a confirmation. The job fails, and GitHub emails
# the repo owner, if any send failed; see docs/brevo-quota-plan.md for what
# to do. Logs here are public: the endpoint returns counts only.

on:
  schedule:
    # Hourly at :17 — scheduled runs at the top of the hour are the most
    # often delayed on GitHub's side
    - cron: '17 * * * *'
  workflow_dispatch: # "Run workflow" to clear a backlog straight away

# The job only calls the site — it needs no access to the repository
permissions: {}

# Never let two runs overlap (e.g. a manual run during a scheduled one)
concurrency:
  group: retry-confirmations
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry unsent confirmations
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://www.c58.uk
        run: |
          # -f: any non-2xx (bad secret, endpoint error) fails the job
          summary=$(curl -fsS --max-time 120 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/cron/retry-confirmations")
          echo "Summary: ${summary}"

          failed=$(echo "${summary}" | jq -r '.failed')
          if [ "${failed}" != "0" ]; then
            echo "::error::${failed} confirmation email(s) failed to send — see docs/brevo-quota-plan.md (check Vercel logs for 'confirmation email failed')"
            exit 1
          fi
