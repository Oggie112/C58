name: Retry Confirmation Emails

# Re-sends order confirmation emails that failed (Brevo quota, outage, network)
# — roadmap 8API.4 — and, since 8API.3, re-tries adding opted-in buyers to the
# Brevo marketing list. Calls the site's secret-protected endpoint. The job
# fails, and GitHub emails the repo owner, if anything failed; see
# docs/brevo-quota-plan.md for what to do. Logs here are public: the endpoint
# returns counts only.

on:
  schedule:
    # Hourly at :17 — scheduled runs at the top of the hour are the most
    # often delayed on GitHub's side
    - cron: '17 * * * *'
  workflow_dispatch: # "Run workflow" to clear a backlog straight away

# The job only calls the site — it needs no access to the repository
permissions: {}

# Never let two runs overlap (e.g. a manual run during a scheduled one)
concurrency:
  group: retry-confirmations
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry unsent confirmations and marketing-list sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://www.c58.uk
        run: |
          # -f: any non-2xx (bad secret, endpoint error) fails the job
          summary=$(curl -fsS --max-time 120 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/cron/retry-confirmations")
          echo "Summary: ${summary}"

          # A missing count is an error (fails the job), never read as zero —
          # an unexpected response must not pass silently
          read_count() { echo "${summary}" | jq -er "$1 | numbers"; }
          email_failed=$(read_count '.confirmations.failed')
          marketing_failed=$(read_count '.marketing.failed')

          if [ "${email_failed}" != "0" ]; then
            echo "::error::${email_failed} confirmation email(s) failed to send — see docs/brevo-quota-plan.md (check Vercel logs for 'confirmation email failed')"
          fi
          if [ "${marketing_failed}" != "0" ]; then
            echo "::error::${marketing_failed} opted-in buyer(s) couldn't be added to the marketing list — check Vercel logs for 'marketing list sync failed'"
          fi
          if [ "${email_failed}" != "0" ] || [ "${marketing_failed}" != "0" ]; then
            exit 1
          fi
